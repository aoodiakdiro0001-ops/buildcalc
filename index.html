const lab=mat*PRICE.laborPct/100,sub=mat+lab,cont=sub*PRICE.contPct/100;
const tot=(sub+cont)*o.city;
const weeks=Math.max(2,Math.round(o.area/12+(o.kind==='new'?10:0)));
return {items:it,mat,lab,sub,cont,tot,m2:tot/o.area,weeks};
}
function fmt(n,cur){const r=CONFIG.fx[cur]||1;const v=n/r;const s=v>=100?Math.round(v).toLocaleString('en-US'):v.toFixed(0);const sym={TRY:'₺',USD:'$',EUR:'€'}[cur]||'';return s+' '+sym;}
function calc(){
const o={kind:document.getElementById('cKind').value,area:num('cArea'),f:+document.getElementById('cFin').value||0,rooms:Math.max(0,Math.round(num('cRooms'))),baths:Math.max(0,Math.round(num('cBaths'))),city:num('cCity',1),cur:document.getElementById('cCur').value};
if(!(o.area>0)){toast(t('needNum'));return;}
const r=estimate(o);curEst={o,r,time:new Date().toLocaleString()};
const rows=r.items.map(x=>`<tr><td>${t(x.k)}</td><td class="n">${x.q>=100?Math.round(x.q).toLocaleString('en-US'):x.q.toFixed(1)} ${t(x.u)}</td><td class="n">${fmt(x.cost,o.cur)}</td></tr>`).join('');
document.getElementById('calcRes').innerHTML=`<table class="bt">${rows}<tr><td><b>${t('rMat')}</b></td><td></td><td class="n"><b>${fmt(r.mat,o.cur)}</b></td></tr><tr><td>${t('rLab')}</td><td></td><td class="n">${fmt(r.lab,o.cur)}</td></tr><tr><td>${t('rSub')}</td><td></td><td class="n">${fmt(r.sub,o.cur)}</td></tr><tr><td>${t('rCont')}</td><td></td><td class="n">${fmt(r.cont,o.cur)}</td></tr><tr><td><b>${t('rTot')}</b></td><td class="n">${t('rM2')}: ${fmt(r.m2,o.cur)}</td><td class="n"><b class="big">${fmt(r.tot,o.cur)}</b></td></tr></table><div class="note">⏱ ${t('rTime')}: ~${r.weeks} ${t('wks')}</div>`;
return r;
}
function hist(){try{return JSON.parse(localStorage.getItem('bc_hist')||'[]');}catch(e){return [];}}
function saveEst(){if(!curEst)calc();if(!curEst)return;try{const h=hist();h.unshift({o:curEst.o,tot:Math.round(curEst.r.tot),time:curEst.time});localStorage.setItem('bc_hist',JSON.stringify(h.slice(0,50)));}catch(e){}renderHist();toast(t('saved'));}
function renderHist(){const h=hist();document.getElementById('histList').innerHTML=h.map((x,i)=>`<div class="hist"><b style="flex:1">${x.o.area}m² · ${t('f'+x.o.f)} · ${x.o.rooms}+${x.o.baths}</b><b>${Math.round(x.tot).toLocaleString('en-US')} ₺</b><small style="color:var(--mut)">${x.time||''}</small><button class="alt" style="padding:5px 12px;font-size:12px" onclick="delHist(${i})">❌</button></div>`).join('')||'<p style="color:var(--mut)">—</p>';}
function delHist(i){try{const h=hist();h.splice(i,1);localStorage.setItem('bc_hist',JSON.stringify(h));}catch(e){}renderHist();}
function printEst(){if(!curEst)calc();if(!curEst)return;const r=curEst.r,o=curEst.o;
document.getElementById('printArea').innerHTML=`<h2>BuildCalc — ${o.area}m²</h2><table>${r.items.map(x=>`<tr><td>${t(x.k)}</td><td>${x.q.toFixed(1)} ${t(x.u)}</td><td>${Math.round(x.cost).toLocaleString('en-US')} ₺</td></tr>`).join('')}<tr><td><b>TOTAL</b></td><td></td><td><b>${Math.round(r.tot).toLocaleString('en-US')} ₺</b></td></tr></table>`;window.print();}
function affFor(k){const a=AFFS.find(x=>x.k===k);return (CONFIG.aff&&CONFIG.aff[k])||(a?a.u:'#');}
function isAff(k){return !!(CONFIG.aff&&CONFIG.aff[k]);}
function renderAff(){
document.getElementById('affGrid').innerHTML=AFFS.map(a=>`<div class="aff"><b>${a.n}${isAff(a.k)?'<span class="refbadge">REF</span>':''}</b><small>${a.d}</small><br><a target="_blank" rel="nofollow sponsored noopener" href="${affFor(a.k)}">→</a></div>`).join('');
}
function renderDonate(){
document.getElementById('btcA').textContent=CONFIG.pay.btc;
document.getElementById('usdtA').textContent=CONFIG.pay.usdt;
}
function loadAds(){const A=CONFIG.ads,el=document.getElementById('adFoot');if(!el)return;
if(A.client){el.innerHTML='<ins class="adsbygoogle" style="display:block" data-ad-client="'+A.client+'" data-ad-slot="'+(A.slot||'')+'" data-ad-format="auto"></ins>';
if(!document.querySelector('script[src*="adsbygoogle"]')){const s=document.createElement('script');s.async=true;s.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client='+A.client;s.crossOrigin='anonymous';document.head.appendChild(s);}try{(window.adsbygoogle=window.adsbygoogle||[]).push({});}catch(e){}}
else if(A.carbonServe){el.innerHTML='';const s=document.createElement('script');s.async=true;s.id='_carbonads_js';s.src='//cdn.carbonads.com/carbon.js?serve='+A.carbonServe+'&placement='+A.carbonPlacement;el.appendChild(s);}}
setLang('en');loadAds();renderDonate();
</script>
</body>
